# Server Configuration
# Render will inject the PORT variable; defaults to 8080 for local dev
server.port=${PORT:8080}
spring.application.name=FurEver

# Database Connection
# Set these in Render: DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Supabase Configuration
# Set these in Render: SUPABASE_URL, SUPABASE_KEY
supabase.bucket=Avatar
supabase.url=${SUPABASE_URL}
supabase.api-key=${SUPABASE_KEY}

# JWT Configuration
# Set this in Render: JWT_SECRET
furever.jwt.secret=${JWT_SECRET}
furever.jwt.expiration=36000
furever.jwt.refresh-expiration=2592000

# CORS Configuration
# Set this in Render: CORS_ORIGINS (e.g., https://your-frontend.vercel.app)
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}
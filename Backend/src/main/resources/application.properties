# Server Configuration
# Render will inject the PORT variable; defaults to 8080 for local dev
server.port=${PORT:8080}
spring.application.name=FurEver

# Database Connection
# Set these in Render: DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Connection Pool
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000

# Lazy loading optimization
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.generate_statistics=false

# HTTP Compression (GZip)
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# Servlet & Performance
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=5

# File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Supabase Configuration
# Set these in Render: SUPABASE_URL, SUPABASE_KEY
supabase.bucket=Avatar
supabase.url=${SUPABASE_URL}
supabase.api-key=${SUPABASE_KEY}

# JWT Configuration
# Set this in Render: JWT_SECRET
furever.jwt.secret=${JWT_SECRET}
furever.jwt.expiration=36000
furever.jwt.refresh-expiration=2592000

# CORS Configuration
# Set this in Render: CORS_ORIGINS (e.g., https://your-frontend.vercel.app)
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}